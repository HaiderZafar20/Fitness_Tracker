apiVersion: v1
kind: Service
metadata:
  name: {{ include "fitness-tracker.fullname" . }}-service
  namespace: {{ .Release.Namespace | default "fitness" }}
spec:
  selector:
    app: {{ include "fitness-tracker.name" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  type: {{ .Values.service.type }}
