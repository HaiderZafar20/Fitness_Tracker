{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "fitness-tracker.fullname" . }}-route
  namespace: {{ .Release.Namespace | default "fitness" }}
spec:
  parentRefs:
  - name: {{ include "fitness-tracker.fullname" . }}-gateway
  rules:
  - backendRefs:
    - name: {{ include "fitness-tracker.fullname" . }}-service
      port: {{ .Values.service.port }}
{{- end }}
